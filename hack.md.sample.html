        // State
        let currentFeature = 'basics';
        let debounceTimer;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            mermaid.initialize({
                startOnLoad: false,
                theme: 'default',
                securityLevel: 'loose'
            });

            renderSidebar();
            loadFeature('basics');

            // Editor input
            document.getElementById('editor').addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updatePreview();
                }, 300);
                updateCharCount();
            });
        });

        function renderSidebar() {
            const list = document.getElementById('feature-list');
            list.innerHTML = features.map(f => `
                <button onclick="loadFeature('${f.id}')" 
                    class="feature-tab w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-slate-700/50 transition-all ${f.id === currentFeature ? 'active' : 'text-slate-400'}"
                    id="tab-${f.id}">
                    <i class="fa-solid ${f.icon} w-5 text-center"></i>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium">${f.name}</div>
                        <div class="text-xs opacity-60 truncate">${f.desc}</div>
                    </div>
                </button>
            `).join('');
        }

        function loadFeature(id) {
            currentFeature = id;
            const feature = features.find(f => f.id === id);
            
            // Update UI
            document.querySelectorAll('.feature-tab').forEach(t => {
                t.classList.remove('active');
                t.classList.add('text-slate-400');
            });
            const tab = document.getElementById(`tab-${id}`);
            tab.classList.add('active');
            tab.classList.remove('text-slate-400');

            // Set content
            document.getElementById('editor').value = feature.code;
            updateCharCount();
            updatePreview();
        }

        function updateCharCount() {
            const count = document.getElementById('editor').value.length;
            document.getElementById('char-count').textContent = `${count} chars`;
        }

        async function updatePreview() {
            const markdown = document.getElementById('editor').value;
            const preview = document.getElementById('preview');
            
            // Custom renderer for special HackMD features
            let html = parseHackMD(markdown);
            
            preview.innerHTML = html;
            
            // Render Mermaid
            await mermaid.run({ nodes: preview.querySelectorAll('.mermaid') });
            
            // Render KaTeX
            if (window.renderMathInElement) {
                renderMathInElement(preview, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function parseHackMD(markdown) {
            // Pre-process HackMD-specific syntax
            
            // Emoji shortcodes :emoji:
            markdown = markdown.replace(/:([\w+-]+):/g, (match, name) => {
                const emojiMap = {
                    'wave': '👋', 'smile': '😄', 'laughing': '😆', 'wink': '😉',
                    'thinking': '🤔', 'sunny': '☀️', 'cloud': '☁️', 'rainbow': '🌈',
                    'fire': '🔥', 'ocean': '🌊', 'rocket': '🚀', 'zap': '⚡',
                    'gear': '⚙️', 'lock': '🔒', 'white_check_mark': '✅', 'x': '❌',
                    'warning': '⚠️', 'bulb': '💡', 'octocat': '🐙', 'shipit': '🐿️',
                    'trollface': '😏', 'memo': '📝', 'sparkles': '✨', 'test_tube': '🧪',
                    'pray': '🙏', 'bug': '🐛', 'book': '📖', 'note': '📋'
                };
                return emojiMap[name] || match;
            });

            // Superscript x^2^
            markdown = markdown.replace(/\^([^\^]+)\^/g, '<sup>$1</sup>');
            
            // Subscript H~2~O
            markdown = markdown.replace(/~([^~]+)~/g, '<sub>$1</sub>');
            
            // Highlight ==text==
            markdown = markdown.replace(/==([^=]+)==/g, '<mark>$1</mark>');

            // Alerts [!NOTE], [!WARNING], etc.
            markdown = markdown.replace(/> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\n> ?(.*(?:\n> .*)*)/gi, (match, type, content) => {
                const lower = type.toLowerCase();
                const icons = {
                    note: '📋',
                    tip: '💡',
                    important: '🔑',
                    warning: '⚠️',
                    caution: '🛑'
                };
                const cleanContent = content.replace(/^> ?/gm, '').trim();
                return `<div class="markdown-alert markdown-alert-${lower}"><p class="markdown-alert-title">${icons[lower]} <strong>${type.charAt(0) + type.slice(1).toLowerCase()}</strong></p><p>${cleanContent}</p></div>`;
            });

            // YouTube embed @[youtube](id)
            markdown = markdown.replace(/@\[youtube\]\(([^)]+)\)/g, 
                '<div class="relative w-full" style="padding-bottom: 56.25%;"><iframe class="absolute inset-0 w-full h-full rounded-lg" src="https://www.youtube.com/embed/$1" frameborder="0" allowfullscreen></iframe></div>'
            );

            // Vimeo embed @[vimeo](id)
            markdown = markdown.replace(/@\[vimeo\]\(([^)]+)\)/g,
                '<div class="relative w-full" style="padding-bottom: 56.25%;"><iframe class="absolute inset-0 w-full h-full rounded-lg" src="https://player.vimeo.com/video/$1" frameborder="0" allowfullscreen></iframe></div>'
            );

            // TOC [TOC]
            markdown = markdown.replace(/\[TOC\]/gi, '<div class="toc bg-slate-50 p-4 rounded-lg mb-4"><p class="font-bold text-slate-700 mb-2">Table of Contents</p><p class="text-sm text-slate-500">Auto-generated from headings</p></div>');

            // Use marked for standard markdown
            marked.setOptions({
                gfm: true,
                breaks: true,
                headerIds: true
            });

            return marked.parse(markdown);
        }

        function refreshPreview() {
            updatePreview();
            showToast('Preview refreshed');
        }

        function copyMarkdown() {
            const md = document.getElementById('editor').value;
            navigator.clipboard.writeText(md).then(() => {
                showToast('Markdown copied!');

        function exportHTML() {
            const md = document.getElementById('editor').value;
            const html = parseHackMD(md);
            const fullHTML = `<!DOCTYPE html>

            const blob = new Blob([fullHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            a.click();

        // PDF Export
        function showPDFModal() {
            document.getElementById('pdf-modal').classList.remove('hidden');
            document.getElementById('pdf-modal').classList.add('flex');
        }

        function closePDFModal() {
            document.getElementById('pdf-modal').classList.add('hidden');
            document.getElementById('pdf-modal').classList.remove('flex');
        }

        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const size = document.getElementById('pdf-size').value;
            const orientation = document.getElementById('pdf-orientation').value;
            const margin = document.getElementById('pdf-margin').checked;
            
            closePDFModal();
            showToast('Generating PDF...');

            try {
                const preview = document.getElementById('preview');
                
                // Create clean container for capture
                const container = document.createElement('div');
                container.style.cssText = 'position: fixed; left: -9999px; top: 0; background: white; padding: 40px; width: 800px;';
                container.innerHTML = preview.innerHTML;
                document.body.appendChild(container);

                // Wait for any async rendering
                await new Promise(r => setTimeout(r, 500));

                const canvas = await html2canvas(container, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false
                });

                document.body.removeChild(container);

                const imgData = canvas.toDataURL('image/png');
                
                // PDF dimensions
                const pageSizes = {
                    a4: { w: 210, h: 297 },
                    letter: { w: 216, h: 279 }
                };

                let pdfWidth, pdfHeight;
                if (size === 'auto') {
                    const ratio = canvas.height / canvas.width;
                    pdfWidth = orientation === 'landscape' ? 297 : 210;
                    pdfHeight = pdfWidth * ratio;
                } else {
                    pdfWidth = orientation === 'landscape' ? pageSizes[size].h : pageSizes[size].w;
                    pdfHeight = orientation === 'landscape' ? pageSizes[size].w : pageSizes[size].h;
                }

                const pdf = new jsPDF({
                    orientation: size === 'auto' ? (pdfWidth > pdfHeight ? 'landscape' : 'portrait') : orientation,
                    unit: 'mm',
                    format: size === 'auto' ? [pdfWidth, pdfHeight] : size
                });

                const m = margin ? 10 : 0;
                const imgW = canvas.width * 0.264583; // px to mm
                const imgH = canvas.height * 0.264583;
                
                let finalW = pdfWidth - 2*m;
                let finalH = finalW * (imgH / imgW);
                
                if (finalH > pdfHeight - 2*m) {
                    finalH = pdfHeight - 2*m;
                    finalW = finalH * (imgW / imgH);
                }

                const x = (pdfWidth - finalW) / 2;
                const y = (pdfHeight - finalH) / 2;

                pdf.addImage(imgData, 'PNG', x, y, finalW, finalH);
                pdf.save('document.pdf');
                showToast('PDF exported!');

            } catch (err) {
                console.error(err);
                showToast('PDF export failed');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
